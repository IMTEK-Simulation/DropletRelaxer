[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "DropletViewer"
dynamic = ["version"]
description = "PyVista viewer for DropletRelaxer runs: live window, run-file replay, video export"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "IMTEK Simulation" }]
requires-python = ">=3.12"
dependencies = [
    "DropletRelaxer",
    "pyvista>=0.43",
    "vtk>=9.3",
    "imageio>=2.30",
    "imageio-ffmpeg>=0.4.9",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/IMTEK-Simulation/DropletRelaxer"

[tool.hatch.version]
source = "vcs"
raw-options = { root = "..", fallback_version = "0.0.0" }

[tool.hatch.build.hooks.vcs]
version-file = "DropletViewer/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["DropletViewer"]
