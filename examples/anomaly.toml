# Sphere dragged across a circular hydrophobic spot on an otherwise smooth
# wall (wettability anomaly, see anomaly.py).
#
#     droplet-relax run examples/anomaly.toml -o anomaly.h5

[roughness]
enabled = false

[anomaly]
enabled = true
center_xy = [40.0, 0.0]
radius = 20.0
contact_angle_deg = 120.0
