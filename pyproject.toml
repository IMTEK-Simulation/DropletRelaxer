[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "DropletRelaxer"
dynamic = ["version"]
description = "Surface-energy relaxation of a liquid droplet on a substrate, with a rigid sphere obstacle"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "IMTEK Simulation" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "h5py>=3.8",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/IMTEK-Simulation/DropletRelaxer"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "DropletRelaxer/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["DropletRelaxer"]

[tool.hatch.build.targets.sdist]
exclude = ["/venv", "/runs", "/docs/_book"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-q --strict-markers"
markers = [
    "slow: real relaxation runs (minutes); deselected unless -m is given or the test is named by node id",
]
